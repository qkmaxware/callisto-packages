name: Build and publish RPM packages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    if: github.event.release.target_commitish == 'root'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq rpm ruby ruby-dev build-essential createrepo-c python3-pip
          sudo gem install --no-document fpm
          pip3 install --quiet packaging

      - name: Retrieve previous packages
        continue-on-error: true
        run: |
          mkdir -p repo
          
          # Attempt to fetch gh-pages
          git fetch origin gh-pages 2>/dev/null || exit 0
          
          # If gh-pages exists, extract existing RPM files
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            echo "Extracting existing RPM packages from gh-pages..."
            
            # Use git show to extract .rpm files without full checkout
            git ls-tree -r --name-only gh-pages | while read -r file; do
              if [[ "$file" == *.rpm ]]; then
                mkdir -p "repo/$(dirname "$file")"
                git show "gh-pages:$file" > "repo/$file" 2>/dev/null || true
              fi
            done
            
            echo "Preserved $(find repo -name '*.rpm' 2>/dev/null | wc -l) existing packages"
          fi

      - name: Build RPM packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG:-0.1.0}"
          version="${version#v}"

          mkdir -p output

          for pkgdir in pkgs/*; do
            if [ ! -d "$pkgdir" ]; then
              continue
            fi

            pkgname="$(basename "$pkgdir")"
            echo "Building package: $pkgname"

            # Set defaults
            pkg_author="GitHub Actions"
            pkg_version="$version"
            pkg_license="MIT"
            pkg_description="RPM package for ${pkgname} generated by GitHub Actions"
            pkg_depends=""

            # Load metadata from metadata.conf if it exists
            if [ -f "$pkgdir/metadata.conf" ]; then
              echo "Loading metadata from $pkgdir/metadata.conf"
              # Source the metadata file (safe because we control it)
              set +u
              source "$pkgdir/metadata.conf"
              set -u
              
              # Use metadata values if they were defined
              [ -n "${PACKAGE_VERSION:-}" ] && pkg_version="${PACKAGE_VERSION}"
              [ -n "${PACKAGE_LICENSE:-}" ] && pkg_license="${PACKAGE_LICENSE}"
              [ -n "${PACKAGE_DESCRIPTION:-}" ] && pkg_description="${PACKAGE_DESCRIPTION}"
              [ -n "${PACKAGE_DEPENDS:-}" ] && pkg_depends="${PACKAGE_DEPENDS}"
              [ -n "${PACKAGE_AUTHOR:-}" ] && pkg_author="${PACKAGE_AUTHOR}"
            fi

            # Load metadata from package.json if it exists (takes priority over metadata.conf)
            if [ -f "$pkgdir/package.json" ]; then
              echo "Loading metadata from $pkgdir/package.json"
              get_json_value() {
                jq -r "$1 // empty" "$pkgdir/package.json" 2>/dev/null
              }

              version=$(get_json_value '.version')
              license=$(get_json_value '.license')
              description=$(get_json_value '.description')
              author=$(get_json_value '.author')
              depends=$(jq -r '
                .dependencies
                | if type == "object" and length > 0
                  then keys | join(",")
                  else empty
                  end
              ' "$pkgdir/package.json" 2>/dev/null)

              [ -n "$version" ] && pkg_version="$version"
              [ -n "$license" ] && pkg_license="$license"
              [ -n "$description" ] && pkg_description="$description"
              [ -n "$depends" ] && pkg_depends="$depends"
              [ -n "$author" ] && pkg_author="$author"
            fi

            if [ -f "$pkgdir/build.sh" ]; then
              echo "Running build.sh for $pkgname"
              chmod +x "$pkgdir/build.sh"
              (cd "$pkgdir" && ./build.sh)
            fi

            if [ ! -d "$pkgdir/files" ]; then
              echo "Skipping $pkgname because no files/ directory exists"
              continue
            fi

            rpm_out="output/${pkgname}-${pkg_version}.rpm"
            
            # Build fpm command with base options
            # Note: All flags must come before positional arguments
            fpm_args=(
              -s dir -t rpm
              -n "$pkgname"
              -v "$pkg_version"
              --iteration 1
              --rpm-os linux
              --prefix /
              --description "$pkg_description"
              --license "$pkg_license"
              --maintainer "$pkg_author"
              -p "$rpm_out"
              -C "$pkgdir/files"
            )

            # Add dependencies if specified (before positional argument)
            if [ -n "$pkg_depends" ]; then
              # Handle comma-separated or space-separated dependencies
              for dep in $(echo "$pkg_depends" | tr ',' '\n' | tr ' ' '\n' | grep .); do
                fpm_args+=(-d "$dep")
              done
            fi

            # Add positional argument last
            fpm_args+=(.)

            fpm "${fpm_args[@]}"
          done

          if [ -z "$(find output -maxdepth 1 -name '*.rpm' -print -quit)" ]; then
            echo "No RPM packages were created"
            exit 1
          fi

      - name: Merge and publish packages
        run: |
          set -euo pipefail
          
          # Move newly built packages into repo (merge with existing)
          mv output/*.rpm repo/ 2>/dev/null || true
          
          # Regenerate repository metadata with all packages (old and new)
          echo "Regenerating repository metadata..."
          createrepo_c --update repo
          
          echo "Repository contains $(find repo -name '*.rpm' | wc -l) total packages"

      - name: Generate packages.json manifest
        run: |
          set -euo pipefail
          
          # Create packages.json from all RPMs using proper metadata extraction
          echo "Generating packages.json manifest..."
          
          # Create a temporary Python script to generate the manifest
          python3 << 'PYTHON_SCRIPT'
          import json
          import subprocess
          import glob
          from pathlib import Path
          from packaging import version as pkg_version
          
          packages_dict = {}
          
          # Extract package info from RPM metadata (not filename)
          for rpm_file in glob.glob('repo/*.rpm'):
              try:
                  # Use rpm command to query package name and version
                  # This is reliable even with dashes in package names
                  result = subprocess.run(
                      ['rpm', '-qp', '--queryformat', '%{NAME}|%{VERSION}', rpm_file],
                      capture_output=True,
                      text=True,
                      check=True
                  )
                  
                  pkg_name, pkg_version_str = result.stdout.strip().split('|')
                  
                  if pkg_name not in packages_dict:
                      packages_dict[pkg_name] = {'name': pkg_name, 'versions': []}
                  
                  # Add version if not already present
                  if pkg_version_str not in packages_dict[pkg_name]['versions']:
                      packages_dict[pkg_name]['versions'].append(pkg_version_str)
                  
                  print(f"Found: {pkg_name} v{pkg_version_str}")
              except subprocess.CalledProcessError as e:
                  print(f"Warning: Could not query {rpm_file}: {e}")
              except Exception as e:
                  print(f"Error processing {rpm_file}: {e}")
          
          # Sort versions (treating them as semantic versions)
          for pkg_name in packages_dict:
              try:
                  packages_dict[pkg_name]['versions'].sort(
                      key=lambda x: pkg_version.parse(x), 
                      reverse=True
                  )
              except Exception:
                  # Fallback to string sort if parsing fails
                  packages_dict[pkg_name]['versions'].sort(reverse=True)
          
          # Convert to sorted list
          result = {'packages': sorted(packages_dict.values(), key=lambda x: x['name'])}
          
          # Write packages.json
          with open('repo/packages.json', 'w') as f:
              json.dump(result, f, indent=2)
          
          print("\nGenerated packages.json:")
          print(json.dumps(result, indent=2))
          PYTHON_SCRIPT

      - name: Copy web interface to repository
        run: |
          set -euo pipefail
          
          echo "Copying web interface files..."
          
          # Copy all files from wwwroot to repo (except existing packages)
          for file in wwwroot/*; do
            if [ -f "$file" ]; then
              cp "$file" repo/
              echo "Copied $(basename "$file")"
            fi
          done

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
