name: Build and publish RPM packages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    if: github.event.release.target_commitish == 'root'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq imagemagick rpm ruby ruby-dev build-essential createrepo-c python3 python3-pip
          sudo gem install --no-document fpm
          pip3 install --quiet packaging

      - name: Retrieve previous packages
        continue-on-error: true
        run: |
          mkdir -p repo/rpm
          
          # Attempt to fetch gh-pages
          git fetch origin gh-pages 2>/dev/null || exit 0
          
          # If gh-pages exists, extract existing RPM files into repo/rpm
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            echo "Extracting existing RPM packages from gh-pages..."
            
            # Use git show to extract .rpm files without full checkout
            git ls-tree -r --name-only gh-pages | while read -r file; do
              if [[ "$file" == *.rpm ]]; then
                mkdir -p "repo/rpm/$(dirname "$file")"
                git show "gh-pages:$file" > "repo/rpm/$file" 2>/dev/null || true
              fi
            done
            
            echo "Preserved $(find repo/rpm -name '*.rpm' 2>/dev/null | wc -l) existing packages"
          fi

      - name: Build RPM packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: | 
          python3 build-packages.py

      - name: Merge and publish RPM packages
        run: |
          set -euo pipefail
          
          # Move newly built packages into repo/rpm (merge with existing)
          mv output/rpm/*.rpm repo/rpm/ 2>/dev/null || true
          
          # Regenerate repository metadata with all packages (old and new)
          echo "Regenerating repository metadata..."
          createrepo_c --update repo/rpm
          
          echo "Repository contains $(find repo/rpm -name '*.rpm' | wc -l) total packages"

      - name: Copy web interface to repository
        run: |
          set -euo pipefail
          
          echo "Copying web interface files..."
          
          # Copy all files from wwwroot to repo (except existing packages)
          for file in wwwroot/*; do
            if [ -f "$file" ]; then
              cp "$file" repo/
              echo "Copied $(basename "$file")"
            fi
          done

          echo "Copying generated package manifest"
          cp packages.json repo/packages.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
