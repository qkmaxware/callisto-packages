name: Build and publish RPM packages

on:
  push:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git jq imagemagick rpm ruby ruby-dev build-essential createrepo-c apt-utils python3 python3-pip gnupg
          sudo gem install --no-document fpm
          pip3 install --quiet packaging

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Build packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: | 
          python3 build-packages.py

      - name: Create RPM Repository
        run: |
          set -euo pipefail
          
          # Move newly built packages into repo/rpm (merge with existing)
          echo "Copying packages..."
          mkdir -p output/rpm repo/rpm
          mv output/rpm/*.rpm repo/rpm/ 2>/dev/null || true

          echo "Repository contains $(find repo/rpm -name '*.rpm' | wc -l) total packages"
          
          GPG_KEY_ID=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ {print $5; exit}')

          echo "Signing rpm packages with key: $GPG_KEY_ID..."
          cat > ~/.rpmmacros <<EOF
          %_signature gpg
          %_gpg_name $GPG_KEY_ID
          %__gpg /usr/bin/gpg
          EOF
          find repo/rpm -name '*.rpm' -print0 | while IFS= read -r -d '' rpm; do
            echo "Signing $rpm"

            rpmsign \
              --addsign "$rpm" \
              --define "__gpg_sign_cmd /usr/bin/gpg --batch --no-tty --pinentry-mode loopback --passphrase $GPG_KEY_PIN -u $GPG_KEY_ID -sbo %{__signature_filename} %{__plaintext_filename}"
          done

          # Regenerate repository metadata with all packages (old and new)
          echo "Regenerating repository metadata..."
          createrepo_c --update repo/rpm

          echo "Signing rpm repository with key: $GPG_KEY_ID..."
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_KEY_PIN" --local-user "$GPG_KEY_ID" --armor --detach-sign --output repo/rpm/repodata/repomd.xml.asc repo/rpm/repodata/repomd.xml

      - name: Create DEB repository
        env:
          GPG_KEY_PIN: ${{ secrets.GPG_KEY_PIN }}
        run: |
          set -euo pipefail
          
          # Move newly built packages into repo/rpm (merge with existing)
          echo "Copying packages..."
          mkdir -p output/deb repo/deb
          mv output/deb/*.deb repo/deb/ 2>/dev/null || true

          echo "Repository contains $(find repo/deb -name '*.deb' | wc -l) total packages"
          
          # Regenerate repository metadata with all packages (old and new)
          echo "Regenerating repository metadata..."
          cd repo/deb
          apt-ftparchive packages . > Packages
          gzip -kf Packages
          apt-ftparchive release . > Release

          GPG_KEY_ID=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec/ {print $5; exit}')
          echo "Signing debian repository with key: $GPG_KEY_ID..."
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_KEY_PIN" --local-user "$GPG_KEY_ID" --armor --detach-sign --output Release.gpg Release
          gpg --verify Release.gpg Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_KEY_PIN" --local-user "$GPG_KEY_ID" --clearsign --output InRelease Release
          gpg --verify InRelease

      - name: Copy web interface to repository
        env:
          GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          
          echo "Copying web interface files..."
          
          # Copy all files from wwwroot to repo (except existing packages)
          for file in wwwroot/*; do
            if [ -f "$file" ]; then
              cp "$file" repo/
              echo "Copied $(basename "$file")"
            fi
          done

          echo "Copying generated package manifest..."
          cp packages.json repo/packages.json
          echo "Copied packages.json"

          echo "Copying public sigining key(s)..."
          mkdir repo/keys
          echo "$GPG_PUBLIC_KEY" > repo/keys/publickey.gpg
          echo "Copied publickey.gpg"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'release' && github.event.release.target_commitish == 'root'
        uses: actions/upload-pages-artifact@v5
        with:
          path: repo

      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' && github.event.release.target_commitish == 'root'
        uses: actions/deploy-pages@v5
