name: Build and publish RPM packages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    if: github.event.release.target_commitish == 'root'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev build-essential createrepo-c
          gem install --no-document fpm

      - name: Build RPM packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG:-0.1.0}"
          version="${version#v}"

          mkdir -p output repo

          for pkgdir in pkgs/*; do
            if [ ! -d "$pkgdir" ]; then
              continue
            fi

            pkgname="$(basename "$pkgdir")"
            echo "Building package: $pkgname"

            if [ -f "$pkgdir/build.sh" ]; then
              echo "Running build.sh for $pkgname"
              chmod +x "$pkgdir/build.sh"
              (cd "$pkgdir" && ./build.sh)
            fi

            if [ ! -d "$pkgdir/files" ]; then
              echo "Skipping $pkgname because no files/ directory exists"
              continue
            fi

            rpm_out="output/${pkgname}-${version}.rpm"
            fpm -s dir -t rpm \
              -n "$pkgname" \
              -v "$version" \
              --iteration 1 \
              --rpm-os linux \
              --prefix / \
              --description "RPM package for ${pkgname} generated by GitHub Actions" \
              --license "MIT" \
              -C "$pkgdir/files" . \
              -p "$rpm_out"
          done

          if [ -z "$(find output -maxdepth 1 -name '*.rpm' -print -quit)" ]; then
            echo "No RPM packages were created"
            exit 1
          fi

          createrepo_c output
          cp -r output/. repo/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: repo

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
