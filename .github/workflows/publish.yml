name: Build and publish RPM packages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-publish:
    if: github.event.release.target_commitish == 'root'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby ruby-dev build-essential createrepo-c
          gem install --no-document fpm

      - name: Retrieve previous packages
        continue-on-error: true
        run: |
          mkdir -p repo
          
          # Attempt to fetch gh-pages
          git fetch origin gh-pages 2>/dev/null || exit 0
          
          # If gh-pages exists, extract existing RPM files
          if git rev-parse --verify gh-pages >/dev/null 2>&1; then
            echo "Extracting existing RPM packages from gh-pages..."
            
            # Use git show to extract .rpm files without full checkout
            git ls-tree -r --name-only gh-pages | while read -r file; do
              if [[ "$file" == *.rpm ]]; then
                mkdir -p "repo/$(dirname "$file")"
                git show "gh-pages:$file" > "repo/$file" 2>/dev/null || true
              fi
            done
            
            echo "Preserved $(find repo -name '*.rpm' 2>/dev/null | wc -l) existing packages"
          fi

      - name: Build RPM packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG:-0.1.0}"
          version="${version#v}"

          mkdir -p output

          for pkgdir in pkgs/*; do
            if [ ! -d "$pkgdir" ]; then
              continue
            fi

            pkgname="$(basename "$pkgdir")"
            echo "Building package: $pkgname"

            # Set defaults
            pkg_version="$version"
            pkg_license="MIT"
            pkg_description="RPM package for ${pkgname} generated by GitHub Actions"
            pkg_depends=""

            # Load metadata from metadata.conf if it exists
            if [ -f "$pkgdir/metadata.conf" ]; then
              echo "Loading metadata from $pkgdir/metadata.conf"
              # Source the metadata file (safe because we control it)
              set +u
              source "$pkgdir/metadata.conf"
              set -u
              
              # Use metadata values if they were defined
              [ -n "${PACKAGE_VERSION:-}" ] && pkg_version="${PACKAGE_VERSION}"
              [ -n "${PACKAGE_LICENSE:-}" ] && pkg_license="${PACKAGE_LICENSE}"
              [ -n "${PACKAGE_DESCRIPTION:-}" ] && pkg_description="${PACKAGE_DESCRIPTION}"
              [ -n "${PACKAGE_DEPENDS:-}" ] && pkg_depends="${PACKAGE_DEPENDS}"
            fi

            if [ -f "$pkgdir/build.sh" ]; then
              echo "Running build.sh for $pkgname"
              chmod +x "$pkgdir/build.sh"
              (cd "$pkgdir" && ./build.sh)
            fi

            if [ ! -d "$pkgdir/files" ]; then
              echo "Skipping $pkgname because no files/ directory exists"
              continue
            fi

            rpm_out="output/${pkgname}-${pkg_version}.rpm"
            
            # Build fpm command with base options
            fpm_args=(
              -s dir -t rpm
              -n "$pkgname"
              -v "$pkg_version"
              --iteration 1
              --rpm-os linux
              --prefix /
              --description "$pkg_description"
              --license "$pkg_license"
              -C "$pkgdir/files"
              .
              -p "$rpm_out"
            )

            # Add dependencies if specified
            if [ -n "$pkg_depends" ]; then
              # Handle comma-separated or space-separated dependencies
              for dep in $(echo "$pkg_depends" | tr ',' '\n' | tr ' ' '\n' | grep .); do
                fpm_args+=(-d "$dep")
              done
            fi

            fpm "${fpm_args[@]}"
          done

          if [ -z "$(find output -maxdepth 1 -name '*.rpm' -print -quit)" ]; then
            echo "No RPM packages were created"
            exit 1
          fi

      - name: Merge and publish packages
        run: |
          set -euo pipefail
          
          # Move newly built packages into repo (merge with existing)
          mv output/*.rpm repo/ 2>/dev/null || true
          
          # Regenerate repository metadata with all packages (old and new)
          echo "Regenerating repository metadata..."
          createrepo_c --update repo
          
          echo "Repository contains $(find repo -name '*.rpm' | wc -l) total packages"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: repo

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
