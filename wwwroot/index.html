<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Callisto RPM Package Repository</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .search-form input {
            flex: 1;
            min-width: 250px;
            padding: 12px 16px;
            font-size: 1em;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            transition: border-color 0.3s;
        }

        .search-form input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-form button {
            padding: 12px 30px;
            font-size: 1em;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .search-form button:hover {
            background: #5568d3;
        }

        .search-form button:active {
            transform: scale(0.98);
        }

        .results-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .results-container.hidden {
            display: none;
        }

        .package-item {
            border-bottom: 1px solid #e0e0e0;
            padding: 20px 0;
        }

        .package-item:last-child {
            border-bottom: none;
        }

        .package-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .package-versions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .package-versions label {
            font-weight: 500;
            color: #666;
            margin-right: 8px;
        }

        .version-tag {
            background: #f0f0f0;
            color: #333;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            font-family: monospace;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .empty-state p {
            font-size: 1.1em;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            border-left: 4px solid #c33;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📦 Callisto RPM Repository</h1>
            <p>Search for packages in the Callisto OS custom package repository</p>
        </header>

        <div class="search-container">
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search package name..." 
                    autocomplete="off"
                >
                <button type="submit">Search</button>
            </form>
        </div>

        <div class="results-container hidden" id="resultsContainer">
            <div id="results"></div>
        </div>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const resultsContainer = document.getElementById('resultsContainer');
        const results = document.getElementById('results');

        let packagesData = [];

        // Load packages.json on page load
        async function loadPackages() {
            try {
                const response = await fetch('packages.json');
                if (!response.ok) {
                    throw new Error('Failed to load packages');
                }
                packagesData = await response.json();
            } catch (error) {
                console.error('Error loading packages:', error);
                results.innerHTML = `<div class="error">Failed to load package repository. Please try again later.</div>`;
                resultsContainer.classList.remove('hidden');
            }
        }

        // Search packages
        function searchPackages(query) {
            if (!query.trim()) {
                resultsContainer.classList.add('hidden');
                return;
            }

            const lowerQuery = query.toLowerCase();
            const filtered = packagesData.filter(pkg => 
                pkg.name.toLowerCase().includes(lowerQuery)
            );

            displayResults(filtered, query);
        }

        // Display search results
        function displayResults(packages, query) {
            resultsContainer.classList.remove('hidden');

            if (packages.length === 0) {
                results.innerHTML = `
                    <div class="empty-state">
                        <p>No packages found matching "${query}"</p>
                    </div>
                `;
                return;
            }

            results.innerHTML = packages.map(pkg => `
                <div class="package-item">
                    <div class="package-name">${pkg.name}</div>
                    <div class="package-versions">
                        <label>Available versions:</label>
                        ${pkg.versions.map(version => 
                            `<span class="version-tag">${version}</span>`
                        ).join('')}
                    </div>
                </div>
            `).join('');
        }

        // Event listeners
        searchForm.addEventListener('submit', (e) => {
            e.preventDefault();
            searchPackages(searchInput.value);
        });

        // Real-time search as user types
        searchInput.addEventListener('input', (e) => {
            searchPackages(e.target.value);
        });

        // Load packages on page load
        loadPackages();
    </script>
</body>
</html>
